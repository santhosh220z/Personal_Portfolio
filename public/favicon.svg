<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="SS monogram">
  <title>SS monogram</title>
  <!--
    The mark is a stroked path, never <text>. A favicon is rendered in the
    browser chrome with no access to the page's webfonts, so a text-based mark
    silently falls back to whatever the OS has and changes shape per platform.
    Paths are font-independent by construction.

    One "S" rather than the "SS" of the nav brandmark: at 16px two S's are ~6px
    wide each and the bowls collapse into a smudge. Condensing to one keeps the
    letterform legible at tab size while still reading as the brandmark.

    The terminal is a square rather than a dot because squares are the site's
    motif — the portrait's registration marks and the marquee's separators are
    both squared.
  -->
  <rect width="100" height="100" rx="22" fill="#0B0B0C" />
  <!-- Barely-there lime hairline: defines the tile against a dark tab bar
       without drawing a second, competing edge. -->
  <rect x="0.5" y="0.5" width="99" height="99" rx="21.5" fill="none" stroke="#E2F952" stroke-opacity="0.18" />

  <g fill="none" stroke="#E2F952" stroke-width="16" stroke-linecap="butt">
    <!-- Geometric S skeleton. Ink spans x 11-69, y 8-78, centred on x=40 so
         the square terminal can occupy the right without crowding it. -->
    <path d="M59 30C59 21 51 16 39 16C27 16 19 21 19 30C19 39 28 43 39 43C51 43 61 47 61 56C61 65 53 70 41 70C32 70 24 67 22 61" />
  </g>

  <rect x="76" y="57" width="14" height="14" fill="#E2F952" />
</svg>
