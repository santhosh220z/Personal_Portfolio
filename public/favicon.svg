    <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
      <path d="M26 37C26 30 4 30 4 42c0 10 22 6 22 16 0 12-22 12-22 5"/>
      <path d="M64 37c0-7-22-7-22 5 0 10 22 6 22 16 0 12-22 12-22 5"/>
    </g>
  </g>
</svg>
