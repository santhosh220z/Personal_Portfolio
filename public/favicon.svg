<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="SS monogram">
  <title>SS monogram</title>
  <defs>
    <linearGradient id="ssmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7E14FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#ssmark)"/>
