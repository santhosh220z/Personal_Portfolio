<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Santhosh Sunkara — applied ML engineer building vision and language systems that survive production: real-time gesture recognition, deepfake forensics, and clinical risk models."
    />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <title>Santhosh Sunkara — Applied ML Engineer</title>
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong ground. Dark is the default rather than the OS preference: the
      // acid accent and the outlined display type were both tuned against
      // charcoal first, so an OS set to light should still land on the
      // intended art direction unless the visitor has chosen otherwise.
      // Mirrors resolveMode() in src/lib/theme.js.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var mode =
            stored === 'light' || stored === 'dark'
              ? stored
              : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
